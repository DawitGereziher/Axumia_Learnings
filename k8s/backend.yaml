apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: ethiolearn
  labels:
    app: backend
spec:
  replicas: 2 # high availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ethiolearn-backend:latest # replace with actual docker registry tag in prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ethiolearn-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ethiolearn-secrets
                  key: JWT_SECRET
            - name: CHAPA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ethiolearn-secrets
                  key: CHAPA_SECRET_KEY
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ethiolearn-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ethiolearn-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: ethiolearn-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: ethiolearn-secrets
                  key: SMTP_PASS
          envFrom:
            - configMapRef:
                name: ethiolearn-config
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /auth/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /auth/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ethiolearn
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: backend
