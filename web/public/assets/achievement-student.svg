<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="achBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>
  <!-- Rounded background card like reference image -->
  <rect width="500" height="600" rx="36" fill="url(#achBg)"/>
  
  <!-- Student portrait illustration -->
  <g transform="translate(100, 80)">
    <!-- Folder/Notebook held in arms -->
    <rect x="180" y="240" width="110" height="150" rx="10" fill="#f97316" transform="rotate(-15 235 315)"/>
    <!-- Student avatar -->
    <circle cx="150" cy="140" r="70" fill="#1e293b"/>
    <circle cx="150" cy="130" r="50" fill="#fed7aa"/>
    <path d="M100,120 Q150,60 200,120" fill="#1e293b"/>
    <path d="M70,300 Q150,220 230,300 L250,440 L50,440 Z" fill="#0284c7"/>
  </g>
  
  <!-- Floating decorative stars/dots -->
  <circle cx="60" cy="120" r="14" fill="#3b82f6"/>
  <polygon points="430,480 445,510 415,510" fill="#ef4444"/>
  <circle cx="440" cy="140" r="8" fill="#10b981"/>
</svg>
