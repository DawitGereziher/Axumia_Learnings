version: '3.8'

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: ethiolearn_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ethiolearn
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ethiolearn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Queue ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ethiolearn_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Backend API (includes D-auth) ──────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ethiolearn_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:password@db:5432/ethiolearn?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma db push --url postgresql://postgres:password@db:5432/ethiolearn?schema=public --accept-data-loss && node dist/main.js"

  # ── Next.js Web App ────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost"
        NEXT_PUBLIC_R2_PUBLIC_DOMAIN: "https://pub-690cc2b08ff243269c59174e79778c39.r2.dev"
    container_name: ethiolearn_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost"
      NEXT_PUBLIC_R2_PUBLIC_DOMAIN: "https://pub-690cc2b08ff243269c59174e79778c39.r2.dev"
      # Disable telemetry for privacy/performance
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      - backend

  # ── Nginx Entry Gateway / Router ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ethiolearn_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
